<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Vedika 🎉</title>
  <link rel="stylesheet" href="happybirthday.css"/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <section class="hero">
    <div class="poppers">
      <span class="popper left">🎉</span>
      <span class="popper right">🎉</span>
    </div>
    <div class="reveal" id="reveal">
      <h1>Congratulations, You're 18! 🥳</h1>
    </div>
  </section>

  <section class="photo-section">
    <img src="bdaygirl.png.png" alt="Vedika" class="her-photo"/>
  </section>

  <section class="message-section">
    <div class="message-box">
      <p class="message">
        Hi Vedika! Happy 18th Birthday! 🎉🎂<br><br>
        Keep smiling, shining 🌟 and rising!<br><br>
        I'll always be rooting for you and praying for your good. 💛
      </p>
    </div>
  </section>

  <section class="links-section">
    <h2>Now that you're 18... 👀</h2>
    <div class="links-grid">
      <a href="https://voters.eci.gov.in" target="_blank" class="link-card">🗳️ Register to Vote</a>
      <a href="https://passportindia.gov.in" target="_blank" class="link-card">🛂 Apply for Passport</a>
      <a href="https://myaadhaar.uidai.gov.in" target="_blank" class="link-card">🪪 Aadhaar Portal</a>
      <a href="https://www.incometax.gov.in" target="_blank" class="link-card">💰 Income Tax Portal</a>
    </div>
  </section>

  <div style="display:none">
    <iframe id="yt-player" width="0" height="0"
      src="https://www.youtube.com/embed/8HC_P0Lg1YU?enablejsapi=1"
      allow="autoplay"
      frameborder="0">
    </iframe>
  </div>

  <script src="happybirthday.js"></script>
</body>
</html>
